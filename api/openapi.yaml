openapi: 3.0.3
info:
  title: Greenlit API
  version: 0.1.0
paths:
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: Set the CSRF cookie and return the token. The app sends it back
        as `X-CSRFToken`.
      tags:
      - csrf
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/files/{file_id}/:
    get:
      operationId: files_retrieve
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/complete/:
    post:
      operationId: files_complete_create
      description: 'The bytes are sent: identify, hash and scan them in the background.'
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/download/:
    get:
      operationId: files_download_retrieve
      description: A link valid for 15 minutes. Refused until the file has been scanned.
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
          description: ''
        '409':
          description: No response body
  /api/flags/:
    get:
      operationId: flags_retrieve
      description: Which modules are on in this deployment, so the app can hide the
        rest.
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Uptime check target (ARCH §8). No data access, so it works before
        org scope exists.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/inbox/:
    get:
      operationId: inbox_retrieve
      description: Everything that needs you across your projects, grouped by urgency
        (FR-INB-01).
      parameters:
      - in: query
        name: snoozed
        schema:
          type: boolean
        description: Show only snoozed items
      tags:
      - inbox
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
          description: ''
  /api/inbox/{item_id}/snooze/:
    post:
      operationId: inbox_snooze_create
      description: Hide an item from your Inbox until a date, with a reason (FR-INB-04).
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snooze'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Snooze'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Snooze'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/inbox/{item_id}/unsnooze/:
    post:
      operationId: inbox_unsnooze_create
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - inbox
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invites/:
    get:
      operationId: invites_list
      description: 'GET: pending invitations. POST: email an invitation with a chosen
        role.'
      tags:
      - invites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: invites_create
      description: 'GET: pending invitations. POST: email an invitation with a chosen
        role.'
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invites/{invite_id}/:
    delete:
      operationId: invites_destroy
      description: Revoke a pending invitation; its link stops working.
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      description: Accept an invitation from the emailed link. Needs a signed-in user
        with the invited email.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: The organisation's newest jobs; `?state=dead` lists the ones waiting
        for an admin.
      parameters:
      - in: query
        name: state
        schema:
          type: string
          enum:
          - dead
          - failed
          - queued
          - running
          - succeeded
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/:
    get:
      operationId: jobs_retrieve
      description: One job, for polling its progress.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/rerun/:
    post:
      operationId: jobs_rerun_create
      description: Run a failed or dead job again from its first attempt.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '409':
          description: No response body
  /api/me/:
    get:
      operationId: me_retrieve
      description: The signed-in user and their own memberships. Works before an organisation
        is chosen.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: People in this organisation. Removed members are not listed.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/members/{user_id}/:
    patch:
      operationId: members_partial_update
      description: 'PATCH: change someone''s role. DELETE: remove them from the organisation.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '204':
          description: No response body
    delete:
      operationId: members_destroy
      description: 'PATCH: change someone''s role. DELETE: remove them from the organisation.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '204':
          description: No response body
  /api/org/:
    get:
      operationId: org_retrieve
      description: The organisation named by the X-Org header, with the caller's role
        in it.
      tags:
      - org
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganisation'
          description: ''
  /api/orgs/:
    post:
      operationId: orgs_create
      description: Create an organisation. The caller becomes its owner.
      tags:
      - orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{key}/:
    get:
      operationId: projects_retrieve
      description: 'GET: one project with its settings. PATCH: rename it, or change
        client or settings.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: projects_partial_update
      description: 'GET: one project with its settings. PATCH: rename it, or change
        client or settings.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
  /api/projects/{key}/defects/:
    get:
      operationId: projects_defects_list
      description: 'GET: the project''s defects, open work first. POST: file a defect
        (FR-DEF-01).'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Part of the title, or a BUG number
      - in: query
        name: release
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - high
          - low
          - medium
      - in: query
        name: state
        schema:
          type: string
          enum:
          - decided
          - needs_retest
          - open
          - retest_failed
          - verified
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DefectRow'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetail'
          description: ''
    post:
      operationId: projects_defects_create
      description: 'GET: the project''s defects, open work first. POST: file a defect
        (FR-DEF-01).'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Part of the title, or a BUG number
      - in: query
        name: release
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - high
          - low
          - medium
      - in: query
        name: state
        schema:
          type: string
          enum:
          - decided
          - needs_retest
          - open
          - retest_failed
          - verified
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefectWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefectWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DefectRow'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetail'
          description: ''
  /api/projects/{key}/defects/{defect_id}/:
    get:
      operationId: projects_defects_retrieve
      description: 'GET: one defect with its retests, evidence and history. PATCH:
        edit its own fields.'
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetail'
          description: ''
    patch:
      operationId: projects_defects_partial_update
      description: 'GET: one defect with its retests, evidence and history. PATCH:
        edit its own fields.'
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDefectEdit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDefectEdit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDefectEdit'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectDetail'
          description: ''
  /api/projects/{key}/defects/{defect_id}/decision/:
    post:
      operationId: projects_defects_decision_create
      description: Won't fix or Deferred, with a reason; the approver is recorded
        (FR-DEF-04).
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/defects/{defect_id}/fixed/:
    post:
      operationId: projects_defects_fixed_create
      description: Set the defect to Fixed (FR-DEF-02). It moves to Needs retest.
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/defects/{defect_id}/retests/:
    post:
      operationId: projects_defects_retests_create
      description: |-
        Record a retest with evidence (FR-DEF-03). Passed: Verified. Failed: Retest failed,
        and the tracker status goes back to Open.
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Retest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Retest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Retest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/defects/{defect_id}/status/:
    post:
      operationId: projects_defects_status_create
      description: 'Set the tracker status: open, in progress, fixed or closed (FR-DEF-02,
        FR-DEF-05).'
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatusChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatusChange'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/files/:
    post:
      operationId: projects_files_create
      description: 'Start an upload: returns a link valid for 15 minutes to send the
        bytes to.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStarted'
          description: ''
  /api/projects/{key}/members/:
    get:
      operationId: projects_members_list
      description: 'GET: who is on the project. POST: add an organisation member to
        it.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
          description: ''
        '204':
          description: No response body
    post:
      operationId: projects_members_create
      description: 'GET: who is on the project. POST: add an organisation member to
        it.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
          description: ''
        '204':
          description: No response body
  /api/projects/{key}/members/{user_id}/:
    delete:
      operationId: projects_members_destroy
      description: Take someone off the project. They stay in the organisation.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
