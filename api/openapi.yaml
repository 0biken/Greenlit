openapi: 3.0.3
info:
  title: Greenlit API
  version: 0.1.0
paths:
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: Set the CSRF cookie and return the token. The app sends it back
        as `X-CSRFToken`.
      tags:
      - csrf
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/files/{file_id}/:
    get:
      operationId: files_retrieve
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/complete/:
    post:
      operationId: files_complete_create
      description: 'The bytes are sent: identify, hash and scan them in the background.'
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/download/:
    get:
      operationId: files_download_retrieve
      description: A link valid for 15 minutes. Refused until the file has been scanned.
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
          description: ''
        '409':
          description: No response body
  /api/flags/:
    get:
      operationId: flags_retrieve
      description: Which modules are on in this deployment, so the app can hide the
        rest.
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Uptime check target (ARCH §8). No data access, so it works before
        org scope exists.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/invites/:
    post:
      operationId: invites_create
      description: Email an invitation to join this organisation with a chosen role.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      description: Accept an invitation from the emailed link. Needs a signed-in user
        with the invited email.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: The organisation's newest jobs; `?state=dead` lists the ones waiting
        for an admin.
      parameters:
      - in: query
        name: state
        schema:
          type: string
          enum:
          - dead
          - failed
          - queued
          - running
          - succeeded
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/:
    get:
      operationId: jobs_retrieve
      description: One job, for polling its progress.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/rerun/:
    post:
      operationId: jobs_rerun_create
      description: Run a failed or dead job again from its first attempt.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '409':
          description: No response body
  /api/me/:
    get:
      operationId: me_retrieve
      description: The signed-in user and their own memberships. Works before an organisation
        is chosen.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: People in this organisation.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/org/:
    get:
      operationId: org_retrieve
      description: The organisation named by the X-Org header, with the caller's role
        in it.
      tags:
      - org
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganisation'
          description: ''
  /api/orgs/:
    post:
      operationId: orgs_create
      description: Create an organisation. The caller becomes its owner.
      tags:
      - orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{key}/:
    get:
      operationId: projects_retrieve
      description: One project, by key. A project the member cannot see is not found.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{key}/files/:
    post:
      operationId: projects_files_create
      description: 'Start an upload: returns a link valid for 15 minutes to send the
        bytes to.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStarted'
          description: ''
  /api/sessions/end-all/:
    post:
      operationId: sessions_end_all_create
      description: 'Sign out everywhere: end every session of this user, this one
        included (SEC §3).'
      tags:
      - sessions
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
      required:
      - token
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
      - slug
    Download:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
        state:
          type: string
        detected_type:
          type: string
        sha256:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        available_at:
          type: string
          format: date-time
          nullable: true
      required:
      - available_at
      - created_at
      - detected_type
      - id
      - kind
      - name
      - rejection_reason
      - sha256
      - size_bytes
      - state
    Flags:
      type: object
      properties:
        enabled:
          type: array
          items:
            type: string
      required:
      - enabled
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - email
      - expires_at
      - id
      - role
    Invite:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - role
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
        progress: {}
        error:
          type: string
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
      required:
      - attempts
      - created_at
      - error
      - finished_at
      - id
      - kind
      - progress
      - started_at
      - state
    KindEnum:
      enum:
      - evidence
      - prd
      - qa_report
      - screenshot
      type: string
      description: |-
        * `evidence` - evidence
        * `prd` - prd
        * `qa_report` - qa_report
        * `screenshot` - screenshot
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        mfa_enabled:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
      required:
      - email
      - id
      - memberships
      - mfa_enabled
      - name
    Member:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        status:
          type: string
      required:
      - email
      - name
      - role
      - status
      - user_id
    MembershipSummary:
      type: object
      properties:
        organisation:
          $ref: '#/components/schemas/OrganisationSummary'
        role:
          type: string
        status:
          type: string
        needs_mfa:
          type: boolean
      required:
      - needs_mfa
      - organisation
      - role
      - status
    OrganisationCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 40
      required:
      - name
    OrganisationCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    OrganisationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - slug
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        client_name:
          type: string
      required:
      - client_name
      - id
      - key
      - name
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        key:
          type: string
          maxLength: 6
        client_name:
          type: string
          maxLength: 200
        member_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - key
      - name
    RoleEnum:
      enum:
      - owner
      - admin
      - qa_lead
      - qa_engineer
      - developer
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `qa_lead` - Qa Lead
        * `qa_engineer` - Qa Engineer
        * `developer` - Developer
        * `viewer` - Viewer
    UploadRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        name:
          type: string
          maxLength: 255
        size:
          type: integer
          minimum: 0
      required:
      - kind
      - name
      - size
    UploadStarted:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/File'
        upload:
          $ref: '#/components/schemas/UploadTarget'
      required:
      - file
      - upload
    UploadTarget:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - fields
      - headers
      - method
      - url
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
