openapi: 3.0.3
info:
  title: Greenlit API
  version: 0.1.0
paths:
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: Set the CSRF cookie and return the token. The app sends it back
        as `X-CSRFToken`.
      tags:
      - csrf
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/files/{file_id}/:
    get:
      operationId: files_retrieve
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/complete/:
    post:
      operationId: files_complete_create
      description: 'The bytes are sent: identify, hash and scan them in the background.'
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/files/{file_id}/download/:
    get:
      operationId: files_download_retrieve
      description: A link valid for 15 minutes. Refused until the file has been scanned.
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - files
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
          description: ''
        '409':
          description: No response body
  /api/flags/:
    get:
      operationId: flags_retrieve
      description: Which modules are on in this deployment, so the app can hide the
        rest.
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Uptime check target (ARCH §8). No data access, so it works before
        org scope exists.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/inbox/:
    get:
      operationId: inbox_retrieve
      description: Everything that needs you across your projects, grouped by urgency
        (FR-INB-01).
      parameters:
      - in: query
        name: snoozed
        schema:
          type: boolean
        description: Show only snoozed items
      tags:
      - inbox
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
          description: ''
  /api/inbox/{item_id}/snooze/:
    post:
      operationId: inbox_snooze_create
      description: Hide an item from your Inbox until a date, with a reason (FR-INB-04).
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snooze'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Snooze'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Snooze'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/inbox/{item_id}/unsnooze/:
    post:
      operationId: inbox_unsnooze_create
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - inbox
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invites/:
    get:
      operationId: invites_list
      description: 'GET: pending invitations. POST: email an invitation with a chosen
        role.'
      tags:
      - invites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: invites_create
      description: 'GET: pending invitations. POST: email an invitation with a chosen
        role.'
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invites/{invite_id}/:
    delete:
      operationId: invites_destroy
      description: Revoke a pending invitation; its link stops working.
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      description: Accept an invitation from the emailed link. Needs a signed-in user
        with the invited email.
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: The organisation's newest jobs; `?state=dead` lists the ones waiting
        for an admin.
      parameters:
      - in: query
        name: state
        schema:
          type: string
          enum:
          - dead
          - failed
          - queued
          - running
          - succeeded
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/:
    get:
      operationId: jobs_retrieve
      description: One job, for polling its progress.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{job_id}/rerun/:
    post:
      operationId: jobs_rerun_create
      description: Run a failed or dead job again from its first attempt.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '409':
          description: No response body
  /api/me/:
    get:
      operationId: me_retrieve
      description: The signed-in user and their own memberships. Works before an organisation
        is chosen.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: People in this organisation. Removed members are not listed.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/members/{user_id}/:
    patch:
      operationId: members_partial_update
      description: 'PATCH: change someone''s role. DELETE: remove them from the organisation.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleChange'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '204':
          description: No response body
    delete:
      operationId: members_destroy
      description: 'PATCH: change someone''s role. DELETE: remove them from the organisation.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '204':
          description: No response body
  /api/org/:
    get:
      operationId: org_retrieve
      description: The organisation named by the X-Org header, with the caller's role
        in it.
      tags:
      - org
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganisation'
          description: ''
  /api/orgs/:
    post:
      operationId: orgs_create
      description: Create an organisation. The caller becomes its owner.
      tags:
      - orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreated'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      description: 'GET: projects this member can see. POST: create a project.'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{key}/:
    get:
      operationId: projects_retrieve
      description: 'GET: one project with its settings. PATCH: rename it, or change
        client or settings.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: projects_partial_update
      description: 'GET: one project with its settings. PATCH: rename it, or change
        client or settings.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
  /api/projects/{key}/defects/{defect_id}/fixed/:
    post:
      operationId: projects_defects_fixed_create
      description: Set the defect to Fixed (FR-DEF-02). It moves to Needs retest.
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/defects/{defect_id}/retests/:
    post:
      operationId: projects_defects_retests_create
      description: |-
        Record a retest with evidence (FR-DEF-03). Passed: Verified. Failed: Retest failed,
        and the tracker status goes back to Open.
      parameters:
      - in: path
        name: defect_id
        schema:
          type: string
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Retest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Retest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Retest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectState'
          description: ''
  /api/projects/{key}/files/:
    post:
      operationId: projects_files_create
      description: 'Start an upload: returns a link valid for 15 minutes to send the
        bytes to.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStarted'
          description: ''
  /api/projects/{key}/members/:
    get:
      operationId: projects_members_list
      description: 'GET: who is on the project. POST: add an organisation member to
        it.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
          description: ''
        '204':
          description: No response body
    post:
      operationId: projects_members_create
      description: 'GET: who is on the project. POST: add an organisation member to
        it.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectMemberAdd'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
          description: ''
        '204':
          description: No response body
  /api/projects/{key}/members/{user_id}/:
    delete:
      operationId: projects_members_destroy
      description: Take someone off the project. They stay in the organisation.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{key}/releases/{version}/:
    get:
      operationId: projects_releases_retrieve
      description: Readiness with blockers by type, verified coverage, the report
        and any sign-off.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: path
        name: version
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
  /api/projects/{key}/releases/{version}/sign-off/:
    post:
      operationId: projects_releases_sign_off_create
      description: Sign off the release (M8-06). Not ready yet needs a written reason,
        kept on the record.
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: path
        name: version
        schema:
          type: string
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOffRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignOffRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignOffRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
  /api/projects/{key}/summary/:
    get:
      operationId: projects_summary_retrieve
      description: 'The project dashboard: next release, verified coverage, open work,
        recent activity.'
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
          description: ''
  /api/sessions/end-all/:
    post:
      operationId: sessions_end_all_create
      description: 'Sign out everywhere: end every session of this user, this one
        included (SEC §3).'
      tags:
      - sessions
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
      required:
      - token
    Activity:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        text:
          type: string
        refs:
          type: array
          items:
            type: string
      required:
      - actor
      - at
      - refs
      - text
    Blocker:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        display_id:
          type: string
        title:
          type: string
        age_days:
          type: integer
        owner_name:
          type: string
          nullable: true
      required:
      - age_days
      - display_id
      - owner_name
      - title
      - type
    Counts:
      type: object
      properties:
        requirements:
          type: integer
        cases:
          type: integer
        runs:
          type: integer
        open_defects:
          type: integer
      required:
      - cases
      - open_defects
      - requirements
      - runs
    Coverage:
      type: object
      properties:
        verified_pct:
          type: integer
        verified:
          type: integer
        on_hold:
          type: integer
        failed:
          type: integer
        not_run:
          type: integer
        total_requirements:
          type: integer
      required:
      - failed
      - not_run
      - on_hold
      - total_requirements
      - verified
      - verified_pct
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
      - slug
    DefectState:
      type: object
      properties:
        display_id:
          type: string
        tracker_status:
          type: string
        qa_status:
          type: string
        shown_as:
          type: string
      required:
      - display_id
      - qa_status
      - shown_as
      - tracker_status
    Download:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
        state:
          type: string
        detected_type:
          type: string
        sha256:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        available_at:
          type: string
          format: date-time
          nullable: true
      required:
      - available_at
      - created_at
      - detected_type
      - id
      - kind
      - name
      - rejection_reason
      - sha256
      - size_bytes
      - state
    Flags:
      type: object
      properties:
        enabled:
          type: array
          items:
            type: string
      required:
      - enabled
    GroupEnum:
      enum:
      - closed_failed_retest
      - needs_retest
      - aging_defects
      - unfiled_failures
      - missing_evidence
      - stale_tests
      - uncovered
      type: string
      description: |-
        * `closed_failed_retest` - closed_failed_retest
        * `needs_retest` - needs_retest
        * `aging_defects` - aging_defects
