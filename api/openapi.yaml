          $ref: '#/components/schemas/UploadRequestKindEnum'
        name:
          type: string
          maxLength: 255
        size:
          type: integer
          minimum: 0
      required:
      - kind
      - name
      - size
    UploadRequestKindEnum:
      enum:
      - evidence
      - prd
      - qa_report
      - screenshot
      type: string
      description: |-
        * `evidence` - evidence
        * `prd` - prd
        * `qa_report` - qa_report
        * `screenshot` - screenshot
    UploadStarted:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/File'
        upload:
          $ref: '#/components/schemas/UploadTarget'
      required:
      - file
      - upload
    UploadTarget:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - fields
      - headers
      - method
      - url
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
