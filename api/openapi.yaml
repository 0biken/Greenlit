components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
      required:
      - token
    Activity:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        text:
          type: string
        refs:
          type: array
          items:
            type: string
      required:
      - actor
      - at
      - refs
      - text
    AttachEvidence:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 1
      required:
      - file_ids
    Blocker:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        display_id:
          type: string
        title:
          type: string
        age_days:
          type: integer
        owner_name:
          type: string
          nullable: true
      required:
      - age_days
      - display_id
      - owner_name
      - title
      - type
    Counts:
      type: object
      properties:
        requirements:
          type: integer
        cases:
          type: integer
        runs:
          type: integer
        open_defects:
          type: integer
      required:
      - cases
      - open_defects
      - requirements
      - runs
    Coverage:
      type: object
      properties:
        verified_pct:
          type: integer
        verified:
          type: integer
        on_hold:
          type: integer
        failed:
          type: integer
        not_run:
          type: integer
        total_requirements:
          type: integer
      required:
      - failed
      - not_run
      - on_hold
      - total_requirements
      - verified
      - verified_pct
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
      - slug
    Decision:
      type: object
      properties:
        decision:
          type: string
        reason:
          type: string
        by:
          type: string
          nullable: true
      required:
      - by
      - decision
      - reason
    DecisionEnum:
      enum:
      - wont_fix
      - deferred
      type: string
      description: |-
        * `wont_fix` - wont_fix
        * `deferred` - deferred
    DecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        reason:
          type: string
          maxLength: 2000
      required:
      - decision
      - reason
    DefectActions:
      type: object
      properties:
        edit:
          type: boolean
        set_status:
          type: array
          items:
            $ref: '#/components/schemas/TrackerStatusEnum'
        retest:
          type: boolean
        decide:
          type: boolean
      required:
      - decide
      - edit
      - retest
      - set_status
    DefectDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        tracker_status:
          $ref: '#/components/schemas/TrackerStatusEnum'
        qa_status:
          $ref: '#/components/schemas/QaStatusEnum'
        shown_as:
          type: string
        chip:
          type: string
        owner_name:
          type: string
          nullable: true
        release:
          type: string
          nullable: true
        age_days:
          type: integer
        created_at:
          type: string
          format: date-time
        steps:
          type: string
        expected:
          type: string
        actual:
          type: string
        owner_id:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          nullable: true
        fixed_at:
          type: string
          format: date-time
          nullable: true
        fixed_by:
          type: string
          nullable: true
        decision:
          allOf:
          - $ref: '#/components/schemas/Decision'
          nullable: true
        found_in:
          allOf:
          - $ref: '#/components/schemas/FoundIn'
          nullable: true
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementRef'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        retests:
          type: array
          items:
            $ref: '#/components/schemas/RetestRow'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryLine'
        actions:
          $ref: '#/components/schemas/DefectActions'
      required:
      - actions
      - actual
      - age_days
      - chip
      - created_at
      - created_by
      - decision
      - display_id
      - evidence
      - expected
      - fixed_at
      - fixed_by
      - found_in
      - history
      - id
      - owner_id
      - owner_name
      - qa_status
      - release
      - requirements
      - retests
      - severity
      - shown_as
      - steps
      - title
      - tracker_status
    DefectRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        tracker_status:
          $ref: '#/components/schemas/TrackerStatusEnum'
        qa_status:
          $ref: '#/components/schemas/QaStatusEnum'
        shown_as:
          type: string
        chip:
          type: string
        owner_name:
          type: string
          nullable: true
        release:
          type: string
          nullable: true
        age_days:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - age_days
      - chip
      - created_at
      - display_id
      - id
      - owner_name
      - qa_status
      - release
      - severity
      - shown_as
      - title
      - tracker_status
    DefectState:
      type: object
      properties:
        display_id:
          type: string
        tracker_status:
          type: string
        qa_status:
          type: string
        shown_as:
          type: string
      required:
      - display_id
      - qa_status
      - shown_as
      - tracker_status
    DefectWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        steps:
          type: string
          maxLength: 10000
        expected:
          type: string
          maxLength: 5000
        actual:
          type: string
          maxLength: 5000
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        owner_id:
          type: string
          format: uuid
          nullable: true
        release:
          type: string
          nullable: true
