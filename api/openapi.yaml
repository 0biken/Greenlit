      - title
    Download:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    Evidence:
      type: object
      properties:
        display_id:
          type: string
        file_id:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        state:
          type: string
      required:
      - display_id
      - file_id
      - mime
      - name
      - state
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        size_bytes:
          type: integer
        state:
          type: string
        detected_type:
          type: string
        sha256:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        available_at:
          type: string
          format: date-time
          nullable: true
      required:
      - available_at
      - created_at
      - detected_type
      - id
      - kind
      - name
      - rejection_reason
      - sha256
      - size_bytes
      - state
    Flags:
      type: object
      properties:
        enabled:
          type: array
          items:
            type: string
      required:
      - enabled
    FoundIn:
      type: object
      properties:
        run:
          type: string
        run_no:
          type: integer
        case:
          type: string
        case_title:
          type: string
        result_id:
          type: string
          format: uuid
      required:
      - case
      - case_title
      - result_id
      - run
      - run_no
    GroupEnum:
      enum:
      - closed_failed_retest
      - needs_retest
      - aging_defects
      - unfiled_failures
      - missing_evidence
      - stale_tests
      - uncovered
      type: string
      description: |-
        * `closed_failed_retest` - closed_failed_retest
        * `needs_retest` - needs_retest
        * `aging_defects` - aging_defects
        * `unfiled_failures` - unfiled_failures
        * `missing_evidence` - missing_evidence
        * `stale_tests` - stale_tests
        * `uncovered` - uncovered
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HistoryLine:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
