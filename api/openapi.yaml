components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
      required:
      - token
    AcceptMany:
      type: object
      properties:
        numbers:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 20
          minItems: 1
        viewed_ms:
          type: integer
          minimum: 0
      required:
      - numbers
    Activity:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        text:
          type: string
        refs:
          type: array
          items:
            type: string
      required:
      - actor
      - at
      - refs
      - text
    Approve:
      type: object
      properties:
        major:
          type: boolean
          default: false
    AttachEvidence:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 1
      required:
      - file_ids
    BlankEnum:
      enum:
      - ''
    Blocker:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        display_id:
          type: string
        title:
          type: string
        age_days:
          type: integer
        owner_name:
          type: string
          nullable: true
      required:
      - age_days
      - display_id
      - owner_name
      - title
      - type
    CaseDetail:
      type: object
      properties:
        case:
          type: string
        number:
          type: integer
        revision:
          type: integer
        title:
          type: string
        preconditions:
          type: string
        steps:
          type: array
          items:
            type: string
        expected:
          type: string
        priority:
          $ref: '#/components/schemas/SeverityEnum'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/CaseRequirement'
        stale:
          type: boolean
          description: No passed or failed result within the project's stale window,
            or a linked requirement changed since the case was written
        retired:
          type: boolean
        plans:
          type: array
          items:
            $ref: '#/components/schemas/CasePlan'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/CaseRevisionRow'
        results:
          type: array
          items:
            $ref: '#/components/schemas/CaseResultRow'
      required:
      - case
      - expected
      - number
      - plans
      - preconditions
      - priority
      - requirements
      - results
      - retired
      - revision
      - revisions
      - stale
      - steps
      - title
    CaseDraft:
      type: object
      properties:
        case:
          type: string
        number:
          type: integer
        title:
          type: string
        case_type:
          oneOf:
          - $ref: '#/components/schemas/CaseTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        priority:
          $ref: '#/components/schemas/SeverityEnum'
        preconditions:
          type: string
        steps:
          type: array
          items:
            type: string
        expected:
          type: string
        review_state:
          $ref: '#/components/schemas/ReviewStateEnum'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DraftRequirement'
        assumptions:
          type: array
          items:
            type: string
        possible_duplicate_of:
          type: string
          nullable: true
      required:
      - assumptions
      - case
      - case_type
      - expected
      - number
      - possible_duplicate_of
      - preconditions
      - priority
      - requirements
      - review_state
      - steps
      - title
    CaseDraftActions:
      type: object
      properties:
        review:
          type: boolean
      required:
      - review
    CaseDrafts:
      type: object
      properties:
        plan:
          type: string
        plan_no:
          type: integer
        title:
          type: string
        drafts:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseDraft'
        gaps:
          type: array
          items:
            type: string
        left_out:
          type: integer
          description: Drafts dropped because a check failed
        job:
          allOf:
          - $ref: '#/components/schemas/JobProgress'
          nullable: true
        allowance_message:
          type: string
        fast_accepts:
          type: integer
          nullable: true
        actions:
          $ref: '#/components/schemas/CaseDraftActions'
      required:
      - accepted
      - actions
      - allowance_message
      - drafts
      - fast_accepts
      - gaps
      - items
      - job
      - left_out
      - plan
      - plan_no
      - rejected
      - title
    CasePlan:
      type: object
      properties:
        display_id:
          type: string
        number:
          type: integer
        title:
          type: string
        version:
          type: string
          nullable: true
          description: None while it is in a draft
        revision:
          type: integer
      required:
      - display_id
      - number
      - revision
      - title
      - version
    CaseRequirement:
      type: object
      properties:
        display_id:
          type: string
        number:
          type: integer
        title:
          type: string
        stale:
          type: boolean
          description: The requirement's text changed after this case
      required:
      - display_id
      - number
      - stale
      - title
    CaseResultRow:
      type: object
      properties:
        run:
          type: string
        run_no:
          type: integer
        outcome:
          type: string
        at:
          type: string
          format: date-time
        revision:
          type: integer
      required:
      - at
      - outcome
      - revision
      - run
      - run_no
    CaseRevisionRow:
      type: object
      properties:
        revision:
          type: integer
        title:
          type: string
        at:
          type: string
          format: date-time
        by:
          type: string
          nullable: true
      required:
      - at
      - by
      - revision
      - title
    CaseTypeEnum:
      enum:
      - positive
      - negative
      - edge
      - accessibility
      type: string
      description: |-
        * `positive` - Positive
        * `negative` - Negative
        * `edge` - Edge
        * `accessibility` - Accessibility
    CaseWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        preconditions:
          type: string
          maxLength: 5000
        steps:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 50
        expected:
          type: string
          maxLength: 5000
        priority:
          $ref: '#/components/schemas/SeverityEnum'
        requirements:
          type: array
          items:
            type: integer
            minimum: 1
          description: 'Requirement numbers: 12 for REQ-12'
        position:
          type: integer
          minimum: 1
          description: 1 is first
      required:
      - expected
      - steps
      - title
    Counts:
      type: object
      properties:
        requirements:
          type: integer
        cases:
          type: integer
        runs:
          type: integer
        open_defects:
          type: integer
      required:
      - cases
      - open_defects
      - requirements
      - runs
    Coverage:
      type: object
      properties:
        verified_pct:
          type: integer
        verified:
          type: integer
        on_hold:
          type: integer
        failed:
          type: integer
        not_run:
          type: integer
        total_requirements:
          type: integer
      required:
      - failed
      - not_run
      - on_hold
      - total_requirements
      - verified
      - verified_pct
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
      - slug
    Decision:
      type: object
      properties:
        decision:
          type: string
        reason:
          type: string
        by:
          type: string
          nullable: true
      required:
      - by
      - decision
      - reason
    DecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionRequestDecisionEnum'
        reason:
          type: string
          maxLength: 2000
      required:
      - decision
      - reason
    DecisionRequestDecisionEnum:
      enum:
      - wont_fix
      - deferred
      type: string
      description: |-
        * `wont_fix` - wont_fix
        * `deferred` - deferred
    DefectActions:
      type: object
      properties:
        edit:
          type: boolean
        set_status:
          type: array
          items:
            $ref: '#/components/schemas/TrackerStatusEnum'
        retest:
          type: boolean
        decide:
          type: boolean
      required:
      - decide
      - edit
