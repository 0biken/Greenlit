# Keep in sync with ../pytest.ini. pytest applies `testpaths` only from the directory that holds
# the config, so each entry point (the repo root and api/) needs its own file; without this,
# running from api/ silently skips the repo-level tests/ folder.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
django_find_project = false
pythonpath = . ..
testpaths = ../tests apps
