# Local development services (ARCH §7). Seed data only; never real customer data.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: greenlit_owner      # migration role; may bypass RLS, never used by the running app
      POSTGRES_PASSWORD: greenlit_owner
      POSTGRES_DB: greenlit
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: greenlit
      MINIO_ROOT_PASSWORD: greenlit-local
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  mail:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
volumes:
  db-data:
  minio-data:
